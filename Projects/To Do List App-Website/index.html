<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-text">My To Do List</div>
    </div>
    <div class="container">
        <h1>To Do List</h1>
        <div class="button-container" id="input-container">
            <input class="enter" type="text" id="task-input" placeholder="Enter a new task">
            <button id="add-task-btn">Add Task</button>
            <button id="clear-task-btn">Clear Tasks</button>
        </div>
        <ul id="task-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
