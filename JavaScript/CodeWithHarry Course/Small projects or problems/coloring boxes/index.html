<!DOCTYPE html>

    <title>Coloring boxes using DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="box" data-Author="Marcos">1</div>

        <div class="box" data-Author="Bob">4</div>

        <div class="box" data-Author="Charlie">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
