<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="weather.jpg" type="image/x-icon">
</head>

<body>
    <div class="container-1">
        <div id="clock-container">

            <h2 id="clock"></h2>

        </div>
        <input id="city-input">
        <button id="search-btn">Search</button>

        <h2 id="city-name"></h2>
        <h1 id="temperature"></h1>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind-speed"></p>

        <img id="weather-icon">
    </div>
    <div id="forecast-section">

        <h2 class="forecast-title">
            5-Day Forecast
        </h2>

        <div id="forecast-container">

        </div>

    </div>
    <script src="components/weather.js"></script>
    <script src="components/forecast.js"></script>
    <script src="components/script.js"></script>
    <script src="components/chart.js"></script>
    <script src="components/clock.js"></script>
</body>

</html>
